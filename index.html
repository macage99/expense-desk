<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Desk</title>
<style>
  :root{--ink:#17202a;--muted:#5d6b7a;--line:#dfe5ec;--bg:#f4f6f9;--card:#fff;--brand:#1f4e79;--brand2:#2e75b6;--ok:#1e7d4f;--warn:#b26a00;--bad:#b3261e;--soft:#eaf1f8}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .co{opacity:.8;font-size:13px}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff}
  nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
  nav button{border:0;background:none;padding:12px 14px;font:inherit;color:var(--muted);border-bottom:3px solid transparent;border-radius:0;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--brand);border-color:var(--brand2);font-weight:600}
  main{max-width:1240px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c5ced8;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
  input[type=checkbox]{width:auto;margin-right:6px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:var(--brand2)}
  button{font:inherit;padding:9px 14px;border-radius:7px;border:1px solid #c5ced8;background:#fff;cursor:pointer;color:var(--ink)}
  button:hover{background:#f3f6fa}
  button.pri{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:600}
  button.pri:hover{background:#2767a3}
  button.sm{padding:4px 9px;font-size:13px}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .sp{flex:1}
  .seg{display:inline-flex;border:1px solid #c5ced8;border-radius:7px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;border-radius:0;background:#fff}
  .seg button.on{background:var(--soft);color:var(--brand);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.nw{white-space:nowrap}
  tr.grp td{background:var(--soft);font-weight:600;color:var(--brand)}
  tr.off td{color:#7a8794}
  tr.click{cursor:pointer} tr.click:hover td{background:#f7fafd}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile.click{cursor:pointer}
  .tile.click:hover{border-color:var(--muted)}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.submitted{background:#fff4e0;color:var(--warn)} .pill.approved{background:#e3f4ea;color:var(--ok)}
  .pill.returned,.pill.bad{background:#fdecea;color:var(--bad)}
  .pill.nb{background:#eceff3;color:var(--muted)} .pill.fee,.pill.info{background:#e8eefc;color:#2b4aa0}
  .msg{padding:10px 12px;border-radius:7px;margin:10px 0;font-size:14px}
  .msg.err{background:#fdecea;color:var(--bad)} .msg.ok{background:#e3f4ea;color:var(--ok)} .msg.lock{background:#eceff3;color:var(--ink)}
  .muted{color:var(--muted)} .hide{display:none!important}
  .auth{max-width:400px;margin:8vh auto}
  .auth .card{padding:24px} .auth h2{font-size:20px} .auth .f{margin-bottom:12px}
  .link{background:none;border:0;color:var(--brand2);padding:0;cursor:pointer;text-decoration:underline}
  .scroll{overflow-x:auto}
  .modal{position:fixed;inset:0;background:rgba(15,25,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal .box{background:#fff;border-radius:10px;padding:16px;max-width:min(900px,96vw);max-height:92vh;overflow:auto}
  .modal img{max-width:100%;display:block}
  .modal iframe{width:min(860px,90vw);height:78vh;border:0}
  .recbar{background:var(--soft);border:1px dashed #9db7d3;border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .hist{font-size:13px;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
  .hist div{padding:4px 0;border-bottom:1px solid #f0f3f6}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  @media(max-width:640px){main{padding:10px}.card{padding:12px}th,td{padding:6px}}
</style>
</head>
<body>
<header>
  <h1>Expense Desk</h1><span class="co" id="co"></span><span class="sp"></span>
  <span id="who" class="co"></span><button id="pw" class="sm hide">Change password</button><button id="out" class="sm hide">Sign out</button>
</header>
<nav id="nav" class="hide"></nav>
<main id="main"></main>
<datalist id="vlist"></datalist>

<script>
// ---------- connection ----------
const INSTANCE = '55850_ginsberg_libby_expenses';
const AUTH = 'https://app.nocodebackend.com/api/user-auth';
const DATA = 'https://app.nocodebackend.com/api/data';
// Web address of the Google Drive receipt go-between (blank = receipts switched off)
const RECEIPTS_URL = 'https://script.google.com/macros/s/AKfycbzQ2k-17vfI-3vOTHJkjAmhKb1r0f2ksdMOBlNGaP7D4SE_2NdTq7h8SdhHyBLF4NfJ9w/exec';
const S = {token: localStorage.getItem('xd_token'), user: null, tab: null, L: {}, month: null, vendorMap: {}};
const $ = (q, el = document) => el.querySelector(q);
const h = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => (Number(n) || 0).toLocaleString('en-US', {style:'currency', currency:'USD'});
const today = () => new Date().toLocaleDateString('en-CA');
const monthName = (m) => new Date(m + '-15').toLocaleDateString('en-US', {month:'long', year:'numeric'});
const numOrNull = (v) => (v == null || v === '' || isNaN(v) ? null : Number(v));
const sum = (a) => a.reduce((s, r) => s + r.amt, 0);

async function api(base, path, method = 'GET', body) {
  const url = base + path + (path.includes('?') ? '&' : '?') + 'Instance=' + INSTANCE;
  const headers = {'Content-Type':'application/json', 'X-Database-Instance': INSTANCE};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const r = await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.error)) || ('Request failed (' + r.status + ')'));
  return j;
}
async function readAll(table, filter = '') {
  let out = [], page = 1;
  for (;;) {
    const j = await api(DATA, `/read/${table}?limit=500&page=${page}${filter}`);
    out = out.concat(j.data || []);
    if (!j.metadata || !j.metadata.hasMore) return out;
    page++;
  }
}
const create = (t, row) => api(DATA, `/create/${t}`, 'POST', row);
const update = (t, id, row) => api(DATA, `/update/${t}/${id}`, 'PUT', row);
const remove = (t, id) => api(DATA, `/delete/${t}/${id}`, 'DELETE');
// Run a list of jobs a few at a time (used when marking many entries billed or reimbursed).
async function inChunks(items, fn, size = 5) {
  for (let i = 0; i < items.length; i += size) await Promise.all(items.slice(i, i + size).map(fn));
}
// Every change is written to the history table so there is a record of who did what.
function log(table, id, action, detail = '') {
  return create('history', {table_name: table, record_id: id, action, detail: String(detail).slice(0, 590), actor_name: S.user.name}).catch(() => {});
}

// ---------- dialogs ----------
function dialog(msg, yes, no) {
  return new Promise((res) => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" style="max-width:440px"><p style="margin:4px 0 16px;white-space:pre-line">${h(msg)}</p>
      <div class="row" style="justify-content:flex-end">${no ? `<button id="dn">${h(no)}</button>` : ''}<button class="pri" id="dy">${h(yes)}</button></div></div>`;
    document.body.appendChild(m);
    const done = (v) => { m.remove(); res(v); };
    $('#dy', m).onclick = () => done(true); if (no) $('#dn', m).onclick = () => done(false);
    $('#dy', m).focus();
  });
}
const ask = (msg, yes = 'Yes') => dialog(msg, yes, 'Cancel');
const tell = (msg) => dialog(msg, 'OK');
// A small form in a box. fields: [{k, label, type: text|number|check|select, options, required}]
function formDialog(title, fields, init = {}, yes = 'Save') {
  return new Promise((res) => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" style="width:min(460px,96vw)"><b>${h(title)}</b><form id="fd" style="margin-top:12px">` +
      fields.map(f => f.type === 'check'
        ? `<div style="margin-bottom:10px"><label style="font-size:14px;color:var(--ink)"><input type="checkbox" name="${f.k}" ${init[f.k] ? 'checked' : ''}>${h(f.label)}</label></div>`
        : `<div style="margin-bottom:10px"><label>${h(f.label)}</label>${f.type === 'select'
            ? `<select name="${f.k}" ${f.required ? 'required' : ''}>${opt(f.options, init[f.k])}</select>`
            : f.type === 'area' ? `<textarea name="${f.k}" rows="3" ${f.required ? 'required' : ''}>${h(init[f.k])}</textarea>`
            : `<input name="${f.k}" type="${f.type === 'number' ? 'number' : f.type === 'password' ? 'password' : f.type === 'month' ? 'month' : 'text'}" ${f.type === 'password' ? 'autocomplete="' + (f.k === 'current' ? 'current-password' : 'new-password') + '" minlength="8"' : ''} ${f.type === 'number' ? 'step="0.001" min="0"' : ''} value="${h(init[f.k])}" ${f.required ? 'required' : ''}>`}</div>`).join('') +
      `<div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" id="fx">Cancel</button><button class="pri">${h(yes)}</button></div></form></div>`;
    document.body.appendChild(m);
    const f = $('#fd', m); const first = f.querySelector('input:not([type=checkbox]),select,textarea'); if (first) first.focus();
    $('#fx', m).onclick = () => { m.remove(); res(null); };
    f.onsubmit = (e) => { e.preventDefault(); const v = {};
      fields.forEach(x => { const el = f.elements[x.k]; v[x.k] = x.type === 'check' ? (el.checked ? 1 : 0) : x.type === 'number' ? numOrNull(el.value) : x.type === 'password' ? el.value : el.value.trim(); });
      m.remove(); res(v); };
  });
}

// ---------- sign in ----------
function authScreen(mode = 'in', err = '') {
  $('#nav').classList.add('hide'); $('#out').classList.add('hide'); $('#pw').classList.add('hide'); $('#who').textContent = '';
  $('#main').innerHTML = `<div class="auth"><div class="card">
    <h2>${mode === 'in' ? 'Sign in' : 'Create your account'}</h2>
    ${err ? `<div class="msg err">${h(err)}</div>` : ''}
    <form id="af">
      ${mode === 'up' ? `<div class="f"><label>Your full name</label><input name="name" required autocomplete="name"></div>` : ''}
      <div class="f"><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
      <div class="f"><label>Password${mode === 'up' ? ' (8 characters or more)' : ''}</label><input name="password" type="password" required minlength="8" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}"></div>
      <button class="pri" style="width:100%">${mode === 'in' ? 'Sign in' : 'Create account'}</button>
    </form>
    <p class="muted" style="margin:14px 0 0">Need an account or forgot your password? Ask your Expense Desk administrator.</p>
  </div></div>`;
  $('#af').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target, f = Object.fromEntries(new FormData(form)), btn = form.querySelector('button'), label = btn.textContent;
    S.token = null; btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const j = await api(AUTH, mode === 'in' ? '/sign-in/email' : '/sign-up/email', 'POST', f);
      S.token = j.token; localStorage.setItem('xd_token', j.token);
      localStorage.setItem('xd_user', JSON.stringify(j.user));
      S.tab = null; start();
    } catch (x) {
      // keep what was typed; only the password is cleared, and the message goes away as soon as they type again
      btn.disabled = false; btn.textContent = label;
      let box = $('.msg.err', form.parentNode);
      if (!box) { box = document.createElement('div'); box.className = 'msg err'; form.parentNode.insertBefore(box, form); }
      box.textContent = x.message + '. Check them and try again.';
      form.elements.password.value = ''; form.elements.password.focus();
      form.oninput = () => { box.remove(); form.oninput = null; };
    }
  };
}
async function changePassword() {
  const v = await formDialog('Change your password', [
    {k: 'current', label: 'Current password', type: 'password', required: true},
    {k: 'next', label: 'New password (8 characters or more)', type: 'password', required: true},
    {k: 'again', label: 'New password again', type: 'password', required: true}], {}, 'Change password');
  if (!v) return;
  if (v.next !== v.again) return tell('The two new passwords do not match. Nothing was changed.');
  if (v.next.length < 8) return tell('The new password needs at least 8 characters. Nothing was changed.');
  try {
    await receiptCall({action: 'changePassword', email: S.user.email, current: v.current, next: v.next});
    tell('Your password is changed. Use the new one next time you sign in.');
  } catch (x) { tell(x.message + ' Nothing was changed.'); }
}
async function signOut() {
  try { await api(AUTH, '/sign-out', 'POST', {}); } catch (e) {}
  localStorage.removeItem('xd_token'); localStorage.removeItem('xd_user'); S.token = null; S.user = null; authScreen();
}

// ---------- start ----------
async function loadLookups() {
  const [clients, projects, categories, eventTypes, settings, batches] = await Promise.all(
    ['clients', 'projects', 'categories', 'event_types', 'settings', 'batches'].map(t => readAll(t)));
  const byName = (a, b) => String(a.name).localeCompare(String(b.name));
  S.L = {allClients: clients.sort(byName), clients: clients.filter(c => c.active), allProjects: projects.sort(byName), projects: projects.filter(p => p.active),
         categories: categories.sort((a, b) => a.id - b.id), allEventTypes: eventTypes, eventTypes: eventTypes.filter(e => e.active),
         setRows: settings, set: Object.fromEntries(settings.map(s => [s.setting_key, s.setting_value])), batches};
  S.rate = parseFloat(S.L.set.mileage_rate || '0.70');
  $('#co').textContent = S.L.set.company_name || '';
}
async function start() {
  if (!S.token) return authScreen();
  $('#main').innerHTML = '<p class="muted">Loading…</p>';
  try {   // the sign-in reply carries the user's name and role; a data read proves the session is still good
    S.user = JSON.parse(localStorage.getItem('xd_user'));
    if (!S.user || !S.user.id) throw new Error('No user');
    await loadLookups();
  } catch (e) { localStorage.removeItem('xd_token'); S.token = null; return authScreen('in', 'Please sign in again.'); }
  $('#who').textContent = S.user.name + (isAdmin() ? ' · Reviewer' : '');
  $('#out').classList.remove('hide'); $('#out').onclick = signOut;
  $('#pw').classList.remove('hide'); $('#pw').onclick = changePassword;
  S.month = S.month || today().slice(0, 7);
  S.tab = S.tab || (isAdmin() ? 'review' : 'mine');
  drawNav(); draw();
}
const isAdmin = () => S.user && S.user.role === 'admin';
const isClosed = (m) => S.L.batches.some(b => b.batch_month === m && (b.status === 'closed' || b.status === 'exported'));
// New entries dated in a closed month are filed under the next month that is still open.
function monthFor(date) {
  let m = date.slice(0, 7);
  for (let i = 0; i < 24 && isClosed(m); i++) { const d = new Date(+m.slice(0, 4), +m.slice(5, 7), 1); m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  return m;
}
function drawNav() {
  const tabs = [['mine', 'My expenses']].concat(isAdmin() ? [['review', 'Review']] : [], [['reports', 'Reports']], isAdmin() ? [['settings', 'Settings']] : []);
  const n = $('#nav'); n.classList.remove('hide');
  n.innerHTML = tabs.map(([k, t]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; drawNav(); draw(); });
}
const draw = () => ({review: drawReview, reports: drawReports, settings: drawSettings}[S.tab] || drawMine)();
const byId = (list, id) => list.find(x => String(x.id) === String(id));
const opt = (list, sel, label = 'name', blank = 'Choose…') => (blank === null ? '' : `<option value="">${blank}</option>`) +
  list.map(x => `<option value="${h(x.id)}" ${String(sel) === String(x.id) ? 'selected' : ''}>${h(x[label])}</option>`).join('');
const monthPicker = (id) => `<div><label>Month</label><input type="month" id="${id}" value="${S.month}"></div>`;

// ---------- entries: one shape for expenses and event fees ----------
const C = (id) => byId(S.L.allClients, id) || {}, P = (id) => byId(S.L.allProjects, id) || {};
function decE(x) { const c = byId(S.L.categories, x.category_id) || {};
  return {...x, t: 'expenses', date: String(x.expense_date).slice(0, 10), cat: c.name || '', fb: c.freshbooks_name || '', amt: Number(x.amount) || 0,
    client: C(x.client_id).name || '', short: C(x.client_id).short_name || '', proj: P(x.project_id).name || ''}; }
function decV(x) { const e = byId(S.L.allEventTypes, x.event_type_id) || {};
  return {...x, t: 'events_worked', fee: true, billable: 1, date: String(x.event_date).slice(0, 10), cat: e.name || '', fb: e.name || '', amt: Number(x.fee) || 0,
    client: C(x.client_id).name || '', short: C(x.client_id).short_name || '', proj: P(x.project_id).name || '', vendor: '', description: ''}; }
const STATUS = {submitted: 'Waiting', approved: 'Approved', returned: 'Sent back'};
const statusPills = (r, full) => `<span class="pill ${h(r.status)}">${STATUS[r.status] || h(r.status)}</span>` +
  (full && r.billed_on ? ' <span class="pill info">Billed</span>' : '') + (r.reimbursed_on ? ' <span class="pill approved">Reimbursed</span>' : '');
const noteCell = (r) => `${r.vendor ? `<b>${h(r.vendor)}</b>` : ''}${r.receipt_number ? ` <span class="muted">#${h(r.receipt_number)}</span>` : ''}${r.description ? `${r.vendor || r.receipt_number ? '<br>' : ''}${h(r.description)}` : ''}`;
const sentBack = (r) => (r.status === 'returned' && r.review_note ? `<div style="color:var(--bad);font-size:13px">Sent back: ${h(r.review_note)}</div>`
  : r.status === 'submitted' && r.review_note ? `<div style="color:var(--warn);font-size:13px">Check: ${h(r.review_note)}</div>` : '');

// ---------- receipts ----------
async function receiptCall(body) {
  if (!RECEIPTS_URL) throw new Error('Receipt storage is not switched on yet.');
  const r = await fetch(RECEIPTS_URL, {method: 'POST', body: JSON.stringify({...body, token: S.token})});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Receipt service error'); return j;
}
function fileToBase64(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
}
async function prepReceipt(file) {
  if (!file.type.startsWith('image/')) return {data: await fileToBase64(file), mimeType: file.type || 'application/pdf'};
  const img = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return {data: c.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg'};
}
async function fileHash(file) {   // a fingerprint of the file itself: the same photo or PDF always gives the same one
  try { const d = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); } catch (e) { return null; }
}
// Who the receipt is from, by simple rule: a company name (… Inc, LLC), the sender's email, or the first real line.
function vendorFrom(text, fallback) {
  if (!text) return fallback || '';
  const generic = /^(tax\s+)?(invoice|receipt|order|statement|bill|payment|transaction|details|summary|thank|page|date|total|subtotal|amount|description|qty|pay online|bill to|ship to|sold to|to|from)\b/i;
  const co = /\b((?:[A-Z][\w&'.-]*\s+){0,4}[A-Z][\w&'.-]*),?\s+(Inc|LLC|L\.L\.C|Ltd|Limited|Corp|Corporation|Co|Company|LP|LLP|GmbH|PLC)\b\.?/i.exec(text.replace(/\r/g, ''));
  if (co) {
    const name = co[1].split(/\s+/).filter(w => !/^(bill|to|from|sold|by|invoice|receipt|merchant|vendor)$/i.test(w)).join(' ');
    if (name) return (name + ' ' + co[2]).trim();
  }
  const mine = ((S.user && S.user.email) || '').toLowerCase(), common = /^(gmail|yahoo|outlook|hotmail|icloud|aol|me|live|msn)\./i;
  for (const m of text.matchAll(/[\w.+-]+@([\w-]+(?:\.[\w-]+)+)/g)) {
    if (m[0].toLowerCase() === mine || common.test(m[1])) continue;
    const label = m[1].split('.').slice(-2, -1)[0];
    if (label) return label.charAt(0).toUpperCase() + label.slice(1);
  }
  const line = text.split(/\r?\n/).map(l => l.trim()).find(l => /[A-Za-z]{3,}/.test(l) && !generic.test(l) && !/^\d/.test(l));
  return (line || fallback || '').slice(0, 60);
}
function refFrom(text) {          // invoice / order / ticket number, by simple rule (the AI reader does this better)
  if (!text) return '';
  const m = /\b(?:invoice|order|receipt|ticket|confirmation|folio|job|check|transaction|trans|ref(?:erence)?)\s*(?:number|no\.?|num|id|#)?\s*[:#]?\s*([A-Z0-9][A-Z0-9-]{3,23})\b/i.exec(text.replace(/\s+/g, ' '));
  return m && /\d/.test(m[1]) ? m[1] : '';
}
async function aiRead(prep, text) {
  try {
    const r = await fetch('/ai-read', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: S.token, text, categories: S.L.categories.map(c => c.name), ...prep})});
    if (r.status === 404 || r.status === 501) return null;   // no AI reader here: keep the basic reading
    return await r.json();
  } catch (e) { return null; }
}
async function showReceipt(fileId) {

  m.innerHTML = '<div class="box"><p class="muted">Loading receipt…</p></div>'; m.onclick = (e) => { if (e.target === m) m.remove(); };

}

// ---------- vendors and duplicates ----------
const normKey = (v) => String(v || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');
// Remember how each vendor has been spelled so the same business is always written the same way.
function setVendors(rows) {
  S.vendorMap = {}; const count = {};
  rows.forEach(r => { if (!r.vendor) return; const k = normKey(r.vendor); if (!k) return;
    count[k] = count[k] || {}; count[k][r.vendor] = (count[k][r.vendor] || 0) + 1; });
  Object.keys(count).forEach(k => { S.vendorMap[k] = Object.entries(count[k]).sort((a, b) => b[1] - a[1])[0][0]; });
  $('#vlist').innerHTML = Object.values(S.vendorMap).sort().map(v => `<option value="${h(v)}">`).join('');
}
const canonVendor = (v) => S.vendorMap[normKey(v)] || v || '';
// Why two entries look like the same receipt, or '' when they don't.
function dupReason(a, b) {
  if (a.receipt_hash && a.receipt_hash === b.receipt_hash) return 'the same receipt file';
  const va = normKey(a.vendor), vb = normKey(b.vendor), sameAmt = Math.abs(Number(a.amount) - Number(b.amount)) < 0.005;
  if (a.receipt_number && normKey(a.receipt_number) === normKey(b.receipt_number) && (sameAmt || (va && va === vb))) return 'the same receipt number';
  const sameDay = String(a.expense_date).slice(0, 10) === String(b.expense_date).slice(0, 10);
  if (va && va === vb && sameAmt && sameDay) return 'the same vendor, date and amount';
  if ((!va || !vb) && sameAmt && sameDay && a.employee_name && normKey(a.employee_name) === normKey(b.employee_name) && a.category_id != null && String(a.category_id) === String(b.category_id)
      && String(a.client_id || '') === String(b.client_id || '')) return 'the same person, date, amount and type';
  return '';
}
function findDup(c, pool) {
  for (const o of pool) { if (c.id != null && o.id === c.id) continue; const why = dupReason(c, o); if (why) return {of: o, why}; }
  return null;
}
const dupText = (d) => `${d.of.employee_name ? d.of.employee_name + ', ' : ''}${String(d.of.expense_date).slice(0, 10)}, ${money(d.of.amount)} (${d.why})`;

  const checkDup = (i) => { const c = asEntry(B[i]);
    B[i].dup = findDup(c, pool) || findDup(c, B.filter((x, j) => j !== i && x.status === 'ready').map(x => ({...asEntry(x), employee_name: 'another receipt in this batch'}))); };

  const body = $('#brows', host), stat = $('#bstat', host), saveBtn = $('#bsave', host);

  const rowHtml = (r, i) => {
    const name = `<td><b>${h(r.file.name.replace(/\.[a-z0-9]+$/i, '').slice(0, 34))}</b>${r.fileId ? ` <button class="sm" data-view="${i}">View</button>` : ''}${r.bad ? `<div style="color:var(--bad);font-size:12px">${h(r.bad)}</div>` : ''}${r.dup && r.status === 'ready' ? `<div style="color:var(--warn);font-size:12px">Possible duplicate of ${h(dupText(r.dup))}</div>` : ''}</td>`;

    if (r.status === 'removed') return `<tr data-i="${i}" class="hide"></tr>`;
    return `<tr data-i="${i}">${name}
      <td><input type="date" data-k="date" value="${h(r.date)}" max="${today()}" style="padding:6px 8px"></td>
      <td><input data-k="vendor" list="vlist" value="${h(r.vendor)}" style="min-width:150px;padding:6px 8px"></td>
      <td><select data-k="category_id" ${inp}>${opt(S.L.categories, r.category_id)}</select></td>
      <td><select data-k="billable" style="padding:6px 8px"><option value="1" ${r.billable ? 'selected' : ''}>Client</option><option value="0" ${r.billable ? '' : 'selected'}>Company</option></select></td>
      <td>${r.billable ? `<select data-k="client_id" ${inp}>${opt(S.L.clients, r.client_id)}</select>` : '<span class="pill nb">company</span>'}</td>
      <td>${r.billable ? `<select data-k="project_id" ${inp}>${opt(S.L.projects.filter(p => String(p.client_id) === String(r.client_id)), r.project_id, 'name', r.client_id ? '(none)' : 'Pick client')}</select>` : ''}</td>
      <td class="n"><input type="number" data-k="amount" value="${h(r.amount)}" min="0" step="0.01" style="width:96px;padding:6px 8px;text-align:right"></td>
      <td><input data-k="ref" value="${h(r.ref)}" style="width:120px;padding:6px 8px"></td>

  };
  body.innerHTML = B.map(rowHtml).join('');
  const live = () => B.filter(r => r.status === 'ready');
  const status = () => {
    const reading = B.filter(r => r.status === 'reading').length, n = live().length;

  };
  const paint = (i) => { const tr = body.querySelector(`tr[data-i="${i}"]`); if (tr) tr.outerHTML = rowHtml(B[i], i); status(); };
  body.addEventListener('change', (e) => {

    r[k] = k === 'billable' ? +e.target.value : e.target.value;
    if (k === 'category_id') { const c = byId(S.L.categories, r.category_id); if (c && !r.touched.billable) r.billable = c.billable_default ? 1 : 0; paint(i); }

      if (r.bad) { bad++; paint(i); } });

// ---------- import whole expense-report PDFs (reviewers) ----------
// A monthly PDF is a stack of reports: a cover form (employee, client, project, totals) with its receipts behind it.
// The PDF is cut into reports here in the browser, each report's pages become pictures, and the AI reader lists the expenses.
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const IMPORT_PAGES = 14;          // most pages sent to the reader in one go
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(); };
    s.onerror = () => rej(new Error('The PDF reader could not be loaded. Check the internet connection and try again.'));
    document.head.appendChild(s);

}
const lineAmt = (l) => Math.round((Number(l && l.amount) || 0) * 100) / 100;
const repSum = (r) => Math.round((r.lines || []).reduce((s, l) => s + lineAmt(l), 0) * 100) / 100;
const repGap = (r) => (typeof r.cover_total === 'number' ? Math.round((repSum(r) - r.cover_total) * 100) / 100 : null);

async function pdfPage(pdf, i) {            // one page as text + a JPEG picture
  const pg = await pdf.getPage(i + 1), v0 = pg.getViewport({scale: 1});
  const vp = pg.getViewport({scale: Math.min(2, 1500 / Math.max(v0.width, v0.height))});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await pg.render({canvasContext: ctx, viewport: vp}).promise;
  const data = c.toDataURL('image/jpeg', 0.7).split(',')[1]; c.width = c.height = 0;
  return {n: i + 1, data};
}
async function pdfTexts(pdf) {
  const out = [];
  for (let i = 0; i < pdf.numPages; i++) {
    const t = await (await pdf.getPage(i + 1)).getTextContent();
    out.push(t.items.map(x => x.str).filter(s => s && s.trim()).join(' | '));
  }

}
function splitReports(texts) {              // [[page indexes]] cut at cover forms; a scan with no readable cover is cut every IMPORT_PAGES pages
  const n = texts.length, covers = texts.map((t, i) => (/EXPENSE[\s|]*REPORT/i.test(t) ? i : -1)).filter(i => i >= 0);
  if (!covers.length) { const out = []; for (let i = 0; i < n; i += IMPORT_PAGES) out.push(Array.from({length: Math.min(IMPORT_PAGES, n - i)}, (_, k) => i + k)); return out; }
  if (covers[0] !== 0) covers.unshift(0);
  return covers.map((c, k) => Array.from({length: (k + 1 < covers.length ? covers[k + 1] : n) - c}, (_, j) => c + j));
}
async function askReader(pdf, texts, pages, cover, year, piece, again) {
  const pics = []; for (const i of pages) pics.push(await pdfPage(pdf, i));
  const body = {action: 'readReport', pages: pics, cover: cover + 1, year, piece: piece || '', again: again || '', categories: S.L.categories.map(c => c.name),
    text: pages.map(i => `--- page ${i + 1} ---\n${(texts[i] || '(no text)').slice(0, 1800)}`).join('\n')};
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { return await receiptCall(body); } catch (x) { last = x; await new Promise(r => setTimeout(r, 1500 * (attempt + 1))); }
  }

}
async function readOneReport(pdf, texts, pages, year, cost) {
  const first = pages[0], add = (j) => { cost.input += j.tokens.input; cost.output += j.tokens.output; return j.reports || []; };
  let reps;
  if (pages.length <= IMPORT_PAGES) {
    reps = add(await askReader(pdf, texts, pages, first, year));
    const off = reps.filter(r => repGap(r) !== null && Math.abs(repGap(r)) > 0.011);
    if (off.length) {                       // one second look when a report does not add up to its cover
      const again = 'You answered once already, but it did not add up: ' + off.map(r => `the report on page ${r.cover_page} has lines adding to ${repSum(r).toFixed(2)} while its cover total is ${r.cover_total.toFixed(2)}`).join('; ') +
        '. Look again for a missed receipt, a missed cover line (mileage is in dollars) or a second cover form, and answer in full again. If the form itself is wrong, keep its figures as written and say so in "problem".';
      try {
        const two = add(await askReader(pdf, texts, pages, first, year, '', again)), bad = (a) => a.reduce((s, r) => s + Math.abs(repGap(r) || 0), 0);
        if (two.length >= reps.length && bad(two) <= bad(reps)) reps = two;

    }

    const rest = pages.slice(1); reps = null;
    for (let k = 0; k < rest.length; k += IMPORT_PAGES - 1) {
      const part = rest.slice(k, k + IMPORT_PAGES - 1);
      const piece = `\nThis is a long report read in pieces: you have the cover and pages ${part[0] + 1} to ${part[part.length - 1] + 1} only. List only the expenses on these receipt pages${k ? '' : ', plus any cover line that has no receipt at all'}. Its lines will not add up to the cover on their own; that is expected here.`;
      const d = add(await askReader(pdf, texts, [first].concat(part), first, year, piece));
      if (!reps) reps = d;
      else if (d.length) { reps[0].lines = (reps[0].lines || []).concat(d[0].lines || []); if (d[0].problem) reps[0].problem = [reps[0].problem, d[0].problem].filter(Boolean).join('; '); reps = reps.concat(d.slice(1)); }
    }

}

// Which client a report belongs to, from the file name and what is written on the cover.
const IMPORT_ALIASES = [['APPL', 'APPLE'], ['MGM', 'AMAZON'], ['FF ', 'FOCUS'], ['PICTURE HOUSE', 'PICTUREHOUSE'], ['MAGNOALIA', 'MAGNOLIA'], ['VERITCAL', 'VERTICAL'], ['FIND ', 'FILM INDEPENDENT'], ['SERIES FEST', 'SERIESFEST']];

    let text = raw; IMPORT_ALIASES.forEach(([a, b]) => { if (text.includes(a)) text += ' ' + b + ' '; });
    let best = null, bestLen = 0;

      const first = keys[1].split(' ')[0]; if (first.length >= 4) keys.push(first);
      for (const k of keys) if (k.length >= 3 && text.includes(' ' + k + ' ') && (k.length > bestLen || (k.length === bestLen && c.active && !best.active))) { best = c; bestLen = k.length; }

    <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="impx">Cancel</button><button class="pri hide" id="impok"></button></div></div>`;

// ---- Part 2: the files imported into a month, with Move (to another month) and Remove for a whole file at once
function importGroups(month) {
  const g = {};

  return g;
}

async function loadReview() {

function download(name, rows) {
  const csv = rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = name; a.click();
}
async function exportFreshbooks() {
  const rows = S.R.filter(r => r.billable), wait = rows.filter(r => r.status !== 'approved').length;
  if (!rows.length) return tell('Nothing to export for this month.');
  if (wait && !(await ask(`${wait} billable entr${wait === 1 ? 'y is' : 'ies are'} not approved yet and will be left out. Continue?`, 'Continue'))) return;
  const out = rows.filter(r => r.status === 'approved').sort((a, b) => (a.short || '').localeCompare(b.short || '') || (a.proj || '').localeCompare(b.proj || '') || a.date.localeCompare(b.date));
  if (!out.length) return tell('No approved billable entries to export yet.');
  download(`EXPENSES FOR BILLING - ${S.month}.csv`, [['DATE', 'AMOUNT', 'CATEGORY', 'DESCRIPTION', 'CLIENT']].concat(
    out.map(r => [r.date, r.amt.toFixed(2), r.fb || r.cat, (r.proj || '').toUpperCase(), r.short || r.client])));
  const todo = out.filter(r => !r.billed_on);
  if (isClosed(S.month) || !todo.length) return;

  $('#rv').innerHTML = '<p class="muted">Marking entries as billed…</p>';

  log('batches', 0, 'exported and billed', `${monthName(S.month)}: ${out.length} lines, ${money(sum(out))}`);
  await setClosed(S.month, true); loadReview();
}
async function exportReimb() {
  const ok = S.R.filter(r => !r.fee && r.status === 'approved' && !r.reimbursed_on), t = {};
  ok.forEach(r => { const e = t[r.employee_name] = t[r.employee_name] || {b: 0, n: 0, c: 0}; r.billable ? e.b += r.amt : e.n += r.amt; e.c++; });
  const names = Object.keys(t).sort(); if (!names.length) return tell('Nobody is owed anything for this month: there are no approved, unreimbursed expenses.');
  download(`REIMBURSEMENTS - ${S.month}.csv`, [['EMPLOYEE', 'ENTRIES', 'BILLABLE', 'COMPANY', 'TOTAL OWED']].concat(names.map(n => [n, t[n].c, t[n].b.toFixed(2), t[n].n.toFixed(2), (t[n].b + t[n].n).toFixed(2)])));

  } else {
    body = `<form id="rates\" style="max-width:420px">
      <div style="margin-bottom:12px"><label>Mileage rate, dollars per mile</label><input name="mileage_rate" type="number" step="0.001" min="0" value="${h(S.L.set.mileage_rate || '')}" required></div>
      <div style="margin-bottom:12px"><label>Company name shown at the top</label><input name="company_name" value="${h(S.L.set.company_name || '')}" required></div>
      <button class="pri">Save</button> <span id="rmsg" class="muted"></span></form>
      <p class="muted" style="margin-top:14px">The mileage rate applies to new entries only. Entries already saved keep the amount they were saved with.</p>`;
  }
  m.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Settings</h2>
    <div class="seg">${tabs.map(([k, t]) => `<button data-st="${k}" class="${S.setTab === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>${body}</div>`;
  m.querySelectorAll('[data-st]').forEach(b => b.onclick = () => drawSettings(b.dataset.st));
  if ($('#sq')) { const s = $('#sq'); s.oninput = () => { S.setQ = s.value; drawSettings(); const n = $('#sq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }; }
  const defs = {
    clients: {title: 'client', fields: [{k: 'name', label: 'Client name', required: true}, {k: 'short_name', label: 'Name on the FreshBooks file (e.g. FOCUS)', required: true}, {k: 'active', label: 'In use: show in the lists staff pick from', type: 'check'}], init: {active: 1}},
    projects: {title: 'project', fields: [{k: 'client_id', label: 'Client', type: 'select', options: S.L.allClients.filter(c => c.active), required: true}, {k: 'name', label: 'Project / title', required: true}, {k: 'active', label: 'In use', type: 'check'}], init: {active: 1}},
    categories: {title: 'expense type', fields: [{k: 'name', label: 'Expense type', required: true}, {k: 'freshbooks_name', label: 'Name on the FreshBooks file (e.g. MEALS)', required: true}, {k: 'billable_default', label: 'Normally billed to a client', type: 'check'}, {k: 'is_mileage', label: 'Entered as miles, priced at the mileage rate', type: 'check'}], init: {billable_default: 1}},
    event_types: {title: 'event fee', fields: [{k: 'name', label: 'Event name as it should appear on the bill', required: true}, {k: 'fee', label: 'Fee in dollars', type: 'number', required: true}, {k: 'active', label: 'In use', type: 'check'}], init: {active: 1}},
  };
  const lists = {clients: 'allClients', projects: 'allProjects', categories: 'categories', event_types: 'allEventTypes'};
  const save = async (table, id) => {
    const d = defs[table], cur = id ? byId(S.L[lists[table]], id) : d.init;
    const fields = d.fields.map(f => (f.k === 'client_id' && id ? {...f, options: S.L.allClients.filter(c => c.active || String(c.id) === String(cur.client_id))} : f));
    const v = await formDialog((id ? 'Edit ' : 'Add ') + d.title, fields, cur); if (!v) return;
    if (v.client_id) v.client_id = +v.client_id;
    if (table === 'clients') v.short_name = v.short_name.toUpperCase();
    if (table === 'categories') v.freshbooks_name = v.freshbooks_name.toUpperCase();
    try {
      if (id) await update(table, id, v); else await create(table, v);
      log(table, id || 0, id ? 'changed a setting' : 'added a setting', `${d.title}: ${v.name}`);
      await loadLookups(); drawSettings();
    } catch (x) { tell('That could not be saved: ' + x.message); }
  };
  const roles = [{id: 'user', name: 'Staff: enters their own expenses'}, {id: 'admin', name: 'Reviewer: sees everyone, approves, bills, settings'}];
  const pCall = async (body, what) => {
    try { const j = await receiptCall({action: 'people', ...body}); S.people = j.people; S.meId = j.me; log('people', 0, what.split('|')[0], what.split('|')[1] || ''); drawSettings(); return j; }
    catch (x) { tell(x.message); return null; }
  };
  const showPw = (u, pw, lead) => tell(`${lead}\n\nEmail: ${u.email}\nTemporary password: ${pw}\n\nWrite this down or copy it now and give it to ${u.name}. It will not be shown again. They can change it after signing in, with "Change password" at the top.`);
  if ($('#pAgain')) $('#pAgain').onclick = () => { S.people = null; S.peopleErr = null; drawSettings(); };
  if ($('#pAdd')) $('#pAdd').onclick = async () => {
    const v = await formDialog('Add a person', [{k: 'name', label: 'Full name', required: true}, {k: 'email', label: 'Email address (they sign in with this)', required: true}, {k: 'role', label: 'Role', type: 'select', options: roles, required: true}], {role: 'user'}, 'Add person');
    if (!v) return;
    const j = await pCall({todo: 'add', name: v.name, email: v.email, role: v.role}, `added a person|${v.name} as ${v.role === 'admin' ? 'reviewer' : 'staff'}`);
    if (j) showPw({name: v.name, email: v.email.toLowerCase()}, j.password, `${v.name} can now sign in.`);
  };
  m.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    const [a, id] = b.dataset.p.split(':'), u = S.people.find(x => x.id === id); if (!u) return;
    if (a === 'edit') {
      const me = u.id === S.meId;
      const v = await formDialog(`Edit ${u.name}`, [{k: 'name', label: 'Full name', required: true}].concat(me ? [] : [{k: 'role', label: 'Role', type: 'select', options: roles, required: true}]), u);
      if (!v) return;
      if (v.name !== u.name && !(await pCall({todo: 'rename', id, name: v.name}, `renamed a person|${u.name} to ${v.name}`))) return;
      if (!me && v.role !== u.role) await pCall({todo: 'role', id, role: v.role}, `changed a role|${v.name} is now ${v.role === 'admin' ? 'a reviewer' : 'staff'}`);
    } else if (a === 'reset') {
      if (!(await ask(u.off ? `Turn ${u.name}'s access back on? They get a new temporary password.` : `Give ${u.name} a new temporary password? Their current password stops working right away.`, u.off ? 'Turn back on' : 'New password'))) return;
      b.disabled = true; const j = await pCall({todo: 'reset', id}, `${u.off ? 'turned access back on' : 'reset a password'}|${u.name}`);
      if (j) showPw(u, j.password, `${u.name} has a new temporary password.`);
    } else if (a === 'off') {
      if (!(await ask(`Turn off ${u.name}'s access? They will not be able to sign in. Everything they entered is kept, and you can turn them back on later.`, 'Turn off'))) return;
      b.disabled = true; await pCall({todo: 'off', id}, `turned off access|${u.name}`);
    } else if (a === 'remove') {
      if (!(await ask(`Remove ${u.name} for good? This only works for someone who has no saved entries.`, 'Remove'))) return;
      b.disabled = true; await pCall({todo: 'remove', id}, `removed a person|${u.name}`);
    }
  });
  m.querySelectorAll('[data-add]').forEach(b => b.onclick = () => save(b.dataset.add));
  m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [t, id] = b.dataset.edit.split(':'); save(t, id); });
  if ($('#rates')) $('#rates').onsubmit = async (e) => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    try {
      for (const k of Object.keys(v)) { const row = S.L.setRows.find(s => s.setting_key === k);
        if (row) { if (row.setting_value !== v[k]) { await update('settings', row.id, {setting_value: v[k]}); log('settings', row.id, 'changed a setting', `${k} to ${v[k]}`); } }
        else await create('settings', {setting_key: k, setting_value: v[k]}); }
      await loadLookups(); $('#rmsg').textContent = 'Saved.';
    } catch (x) { tell('That could not be saved: ' + x.message); }
  };
}
start();
</script>
</body>
</html>
